<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beacon — Peace of Mind engineered</title>
<style>
:root{--bg:#0a0a0a;--ink:#ffffff;--muted:#a1a1aa;--gold:#d4af37;--line:rgba(255,255,255,.15)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}
.page{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.page::before{content:'';position:absolute;inset:0;z-index:1;background-image:url('https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=2000&auto=format&fit=crop');background-size:cover;background-position:center}
.page::after{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom, rgba(10,10,10,0.5), rgba(10,10,10,0.98))}
.grain{position:absolute;inset:-50%;opacity:.04;pointer-events:none;z-index:15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
header{position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:32px clamp(24px,5vw,72px);animation:fadeDown .9s ease both}
.brand{display:flex;align-items:center;gap:11px;letter-spacing:.18em;font-weight:700;font-size:13px}
.header-logo{width:29px;height:29px;object-fit:contain;filter:brightness(0) invert(1)}
.status{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 0 0 rgba(212,175,55,.5);animation:pulse 2s infinite}
main{position:relative;z-index:20;flex:1;display:grid;place-items:center;padding:20px 24px 80px}
.hero{width:min(920px,100%);text-align:center;margin-top:-3vh}
.hero-logo-wrapper{margin-bottom:24px;animation:rise 1s .05s ease both}
.hero-logo{width:76px;height:76px;object-fit:contain;filter:brightness(0) invert(1);animation:pulseLogo 2.5s infinite ease-in-out}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:26px;animation:rise 1s .15s ease both}
h1{margin:0 auto;max-width:900px;font-size:clamp(52px,9vw,112px);line-height:.91;letter-spacing:-.065em;font-weight:500;animation:rise 1.1s .25s ease both}
h1 em{font-style:normal;color:#c2c2c2}
.sub{max-width:570px;margin:32px auto 0;color:var(--muted);font-size:clamp(15px,1.6vw,18px);line-height:1.65;animation:rise 1s .45s ease both}
.signal{margin:34px auto 0;display:inline-flex;align-items:center;gap:10px;padding:12px 17px;border:1px solid var(--line);border-radius:100px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.08);backdrop-filter:blur(8px);animation:rise 1s .6s ease both}
.signal span{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%}
.horizon{position:absolute;left:-10%;right:-10%;bottom:11%;height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,rgba(212,175,55,.65) 50%,var(--line) 82%,transparent);z-index:3;animation:horizonIn 1.8s .2s ease both}
.sun{position:absolute;left:50%;bottom:11%;width:min(43vw,540px);height:min(43vw,540px);transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),rgba(212,175,55,.08) 28%,rgba(212,175,55,.02) 52%,transparent 70%);filter:blur(1px);z-index:3;animation:sunrise 2.4s cubic-bezier(.16,1,.3,1) both}
.ring{position:absolute;left:50%;bottom:11%;transform:translate(-50%,50%);width:min(28vw,360px);height:min(28vw,360px);border:1px solid rgba(212,175,55,.2);border-radius:50%;z-index:3;animation:expand 2s 1s ease both}
footer{position:absolute;z-index:20;bottom:28px;left:0;right:0;text-align:center;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;animation:fadeUp 1s .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes horizonIn{from{opacity:0;transform:scaleX(.25)}to{opacity:1;transform:scaleX(1)}}
@keyframes sunrise{from{opacity:0;transform:translate(-50%,65%) scale(.6)}to{opacity:1;transform:translate(-50%,50%) scale(1)}}
@keyframes expand{from{opacity:0;transform:translate(-50%,50%) scale(.65)}to{opacity:1;transform:translate(-50%,50%) scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.45)}50%{box-shadow:0 0 0 6px rgba(212,175,55,0)}}
@keyframes pulseLogo{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,255,255,.05))}50%{transform:scale(1.1);filter:drop-shadow(0 0 25px rgba(212,175,55,.3))}}
@media(max-width:650px){
  header{padding:24px 20px}
  .status{display:none}
  .brand{font-size:12px}
  .header-logo{width:25px;height:25px}
  .hero-logo{width:56px;height:56px}
  main{padding:10px 20px 70px}
  .hero{margin-top:-8vh}
  .eyebrow{font-size:9px;letter-spacing:.23em;margin-bottom:20px}
  h1{font-size:clamp(48px,15vw,76px);letter-spacing:-.07em}
  .sub{font-size:14px;line-height:1.6;margin-top:25px;max-width:390px}
  .signal{margin-top:27px;padding:10px 14px;font-size:8px}
  .horizon,.sun,.ring{bottom:13%}
  .sun{width:95vw;height:95vw}
  .ring{width:60vw;height:60vw}
  footer{bottom:20px;font-size:8px;letter-spacing:.13em}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
  <div class="page">
    <div class="grain"></div>
    <header>
      <div class="brand">
        <img src="icon-192.png" alt="Beacon" class="header-logo">
        <span>BEACON</span>
      </div>
      <div class="status">
        <i class="dot"></i> Signal detected
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-logo-wrapper">
          <img src="icon-192.png" alt="Beacon Signal" class="hero-logo">
        </div>
        <div class="eyebrow">Peace of mind engineered</div>
        <h1>Something big<br><em>is on the horizon.</em></h1>
        <p class="sub">We're building something designed to keep the people who matter most connected, protected, and close.</p>
        <div class="signal">
          <span></span> Beacon is coming online
        </div>
      </section>
    </main>
    <div class="sun"></div>
    <div class="ring"></div>
    <div class="horizon"></div>
    <footer>mybeacon.ng&nbsp; • &nbsp;Coming soon</footer>
  </div>
</body>
</html>
